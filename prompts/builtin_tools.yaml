workdir_add:
  approval: true
  description: 添加一个本地文件夹作为工作目录。文件夹必须真实存在且可读，添加成功后即可在该文件夹内读取和修改文件、执行命令。可添加多个工作目录。
  parameters:
    path:
      type: string
      description: 要添加的文件夹的绝对路径
  required:
  - path
workdir_change:
  approval: true
  description: 修改工作目录，把列表中已有的某个工作目录替换为另一个文件夹。新文件夹必须真实存在且可读。
  parameters:
    path:
      type: string
      description: 当前工作目录的绝对路径，必须是已经添加过的
    new_path:
      type: string
      description: 替换后的新文件夹绝对路径
  required:
  - path
  - new_path
workdir_remove:
  approval: true
  description: 删除一个已经添加的工作目录，之后不再允许访问该文件夹。可以删除到没有任何工作目录。
  parameters:
    path:
      type: string
      description: 要移除的工作目录绝对路径
  required:
  - path
list_dir:
  approval: false
  description: 列出文件夹内的条目，查看某个文件夹里有哪些文件和子文件夹。只允许查看已添加工作目录内的位置。
  parameters:
    path:
      type: string
      description: 文件夹绝对路径，或相对于工作目录的路径
    pattern:
      type: string
      description: 可选，通配符过滤，例如 *.py
  required:
  - path
read_file:
  approval: false
  description: 读取文件内容，支持常见文本格式。只允许读取已添加工作目录内的文件。
  parameters:
    path:
      type: string
      description: 文件绝对路径，或相对于工作目录的路径
    max_chars:
      type: integer
      description: 可选，最多读取的字符数，默认 8000
  required:
  - path
create_file:
  approval: true
  description: 创建新文件并写入文本内容。只允许在已添加工作目录内创建文件。
  parameters:
    path:
      type: string
      description: 新文件的绝对路径，或相对于工作目录的路径
    content:
      type: string
      description: 要写入的完整文本内容
  required:
  - path
  - content
edit_text:
  approval: true
  description: 修改文件内的一段文本：把指定的旧文本替换为新文本；旧文本留空表示在文件末尾追加新文本。只允许修改已添加工作目录内的文件。
  parameters:
    path:
      type: string
      description: 文件绝对路径，或相对于工作目录的路径
    old_text:
      type: string
      description: 要替换掉的旧文本，留空表示在末尾追加
    new_text:
      type: string
      description: 替换后的新文本，或要追加的内容
  required:
  - path
  - old_text
  - new_text
delete_path:
  approval: true
  description: 删除文件或文件夹。只允许删除已添加工作目录内的路径。
  parameters:
    path:
      type: string
      description: 要删除的文件或文件夹绝对路径，或相对于工作目录的路径
    recursive:
      type: boolean
      description: 可选，删除非空文件夹时需要设为 true
  required:
  - path
create_dir:
  approval: true
  description: 创建新文件夹。只允许在已添加工作目录内创建文件夹。
  parameters:
    path:
      type: string
      description: 新文件夹的绝对路径，或相对于工作目录的路径
  required:
  - path
run_command:
  approval: true
  description: 在已添加的工作目录内运行命令行指令，用于查看文件、运行程序、安装依赖等。执行目录会被限制在工作目录范围内。
  parameters:
    command:
      type: string
      description: 要执行的命令行指令
    cwd:
      type: string
      description: 可选，执行目录，必须是工作目录或其子文件夹；默认使用第一个工作目录
  required:
  - command
approval_reject_text: '该操作已被手动拒绝。

  被拒绝的操作：{operation}'
