[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guantang"
version = "0.1.0"
description = "灌汤：带强烈人格的 AI 干活框架"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "mcp>=1.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[project.scripts]
guantang = "main:main"

[tool.setuptools]
packages = ["guantang", "guantang.providers"]
