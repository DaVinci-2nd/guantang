[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guantang"
version = "0.1.0"
description = "灌汤：本地部署的中文 AI 角色扮演聊天与智能体框架。支持 OpenAI 兼容多模型接入、MCP 技能扩展、联网搜索、文件读写与命令执行（带审批），内置 Web UI 与 CLI。"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "mcp>=1.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[project.scripts]
guantang = "main:main"

[tool.setuptools]
packages = ["guantang", "guantang.providers"]
